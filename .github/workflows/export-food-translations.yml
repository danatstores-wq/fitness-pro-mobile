name: Export food translations to Excel

on:
  push:
    branches: [main]
    paths:
      - "docs/food-name-review.csv"
      - "scripts/export-food-translations.py"
      - ".github/workflows/export-food-translations.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Excel writer
        run: python -m pip install openpyxl
      - name: Create Excel workbook
        run: python scripts/export-food-translations.py
      - name: Upload Excel workbook
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-food-translations
          path: food-translations-review.xlsx
          if-no-files-found: error
          retention-days: 90
