name: Build FITNESS PRO Release APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-release-apk-aab.yml'

permissions:
  contents: read

jobs:
  android-release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_ADMOB_USE_TEST_ADS: "false"
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;37.0.0'
          accept-android-sdk-licenses: true

      - name: Install Android 17 preview platform required by Expo SDK 58
        run: yes | sdkmanager --channel=1 "platforms;android-37.0"

      - name: Verify required secrets
        run: |
          set -e
          for name in EXPO_PUBLIC_FIREBASE_API_KEY ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > android/app/fitness-pro-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text()
          config = """
              signingConfigs.create("release") {
                  storeFile file("fitness-pro-upload.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          """
          if 'signingConfigs.create("release")' not in source:
              match = re.search(r"(?m)^(\s*)buildTypes\s*\{", source)
              if not match:
                  raise SystemExit("Unable to find buildTypes in generated Gradle file")
              source = source[:match.start()] + config + "\n" + source[match.start():]
          source, count = re.subn(
              r"(?m)^(\s*)signingConfig\s+signingConfigs\.debug\s*$",
              r'\1signingConfig signingConfigs.getByName("release")',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not switch release signing config to permanent upload key")
          gradle_file.write_text(source)
          print("Release signing configured.")
          PY

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build signed release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify APK and AAB files
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          echo "Both signed release files were generated."

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Fitness-Pro-Final-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Fitness-Pro-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
