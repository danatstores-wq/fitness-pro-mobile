name: Build FITNESS PRO testing APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-testing-apk:
    name: Build standalone Android testing APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_ADMOB_USE_TEST_ADS: "false"
    timeout-minutes: 45
    steps:
      - name: Check out working version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;37.0.0'
          accept-android-sdk-licenses: true

      - name: Install Android 17 preview platform required by Expo SDK 58
        run: yes | sdkmanager --channel=1 "platforms;android-37.0"

      - name: Verify Firebase API key secret is configured
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Add EXPO_PUBLIC_FIREBASE_API_KEY under Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project from the existing Expo config
        run: npx expo prebuild --platform android --no-install

      - name: Configure permanent Android upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | sed '/-----BEGIN CERTIFICATE-----/d; /-----END CERTIFICATE-----/d' | tr -d '\r\n' | base64 --decode > android/app/fitness-pro-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text()
          signing = """
              signingConfigs {
                  release {
                      storeFile file("fitness-pro-upload.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" not in source:
              source, count = re.subn(r"(android\s*\{)", r"\1" + signing, source, count=1)
              if count != 1:
                  raise SystemExit("Could not locate the android block in app/build.gradle")
          release_pattern = r"(release\s*\{[\s\S]*?signingConfig\s+)signingConfigs\.debug"
          source, count = re.subn(release_pattern, r"\1signingConfigs.release", source, count=1)
          if count != 1:
              raise SystemExit("Could not find the release build's debug signingConfig to replace")
          gradle_file.write_text(source)
          print("Release signing configured.")
          PY

      - name: Build standalone release APK for testing
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon


      - name: Capture Android startup diagnostics
        if: always()
        working-directory: android
        run: |
          mkdir -p ../android-startup-diagnostics
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > ../android-startup-diagnostics/release-dependencies.txt 2>&1 || true
          ./gradlew :app:dependencyInsight --dependency androidx.work --configuration releaseRuntimeClasspath --no-daemon > ../android-startup-diagnostics/workmanager-dependency.txt 2>&1 || true
          find app/build/outputs/mapping -type f -name 'mapping.txt' -exec cp --parents {} ../android-startup-diagnostics/ \; 2>/dev/null || true
          find app/build/intermediates -type f \( -name 'AndroidManifest.xml' -o -name 'AndroidManifest.xml' \) | grep -E 'merged_manifest|merged_manifests' | head -10 | while read f; do cp --parents "$f" ../android-startup-diagnostics/; done
          find app/build -type f -name '*manifest*report*.txt' -exec cp --parents {} ../android-startup-diagnostics/ \; 2>/dev/null || true

      - name: Upload Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-android-startup-diagnostics
          path: android-startup-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload standalone testing APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-standalone-testing-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
