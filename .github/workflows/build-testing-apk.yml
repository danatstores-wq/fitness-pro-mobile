name: Build FITNESS PRO testing APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-testing-apk.yml"

permissions:
  contents: read

jobs:
  android-testing-apk:
    name: Build Android testing APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out working version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project from the existing Expo config
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK for testing
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-testing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
