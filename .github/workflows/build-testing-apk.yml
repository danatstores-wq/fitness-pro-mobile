name: Build FITNESS PRO testing APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-testing-apk:
    name: Build standalone Android testing APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_ADMOB_USE_TEST_ADS: "true"
    timeout-minutes: 45
    steps:
      - name: Check out working version
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;37.0.0'
          accept-android-sdk-licenses: true

      - name: Install Android 17 preview platform required by Expo SDK 58
        run: yes | sdkmanager --channel=1 "platforms;android-37.0"

      - name: Verify Firebase API key secret is configured
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Add EXPO_PUBLIC_FIREBASE_API_KEY under Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Android project from the existing Expo config
        run: npx expo prebuild --platform android --no-install

      - name: Build standalone release APK for testing
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload standalone testing APK
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-standalone-testing-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
