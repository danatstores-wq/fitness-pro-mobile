name: Deploy FITNESS PRO web preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Firebase API key secret is configured
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Add EXPO_PUBLIC_FIREBASE_API_KEY under Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Build Expo web app
        run: npx expo export --platform web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-preview:
    name: Verify live browser features
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test guest dashboard and protected-feature registration gate
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", error => errors.push(error.message));
          page.on("console", message => {
            if (message.type() === "error") errors.push(message.text());
          });
          page.on("dialog", dialog => dialog.accept());

          try {
            let isolated = false;
            for (let attempt = 0; attempt < 4; attempt += 1) {
              try {
                await page.goto(process.env.PREVIEW_URL, { waitUntil: "domcontentloaded", timeout: 120000 });
              } catch {}
              await page.waitForTimeout(4000);
              isolated = await page.evaluate(() => ({
                isolated: window.crossOriginIsolated,
                sharedArrayBuffer: typeof SharedArrayBuffer !== "undefined",
                controlled: Boolean(navigator.serviceWorker?.controller)
              }));
              if (isolated.isolated && isolated.sharedArrayBuffer) break;
              await page.reload({ waitUntil: "domcontentloaded", timeout: 120000 }).catch(() => {});
            }
            if (!isolated.isolated || !isolated.sharedArrayBuffer) {
              throw new Error("Web SQLite prerequisites failed: " + JSON.stringify(isolated));
            }
            console.log("PASS: web storage has cross-origin isolation and SharedArrayBuffer.");

            // Confirm the public dashboard remains visible to guests and a protected
            // feature asks them to register/log in instead of exposing private content.
            await page.getByText("Create your free account", { exact: true }).waitFor({ timeout: 60000 });
            await page.getByText("Register or log in to unlock Fitness Pro.", { exact: true }).waitFor();
            await page.getByText("Not now", { exact: true }).click();
            await page.getByText("Daily calories", { exact: true }).waitFor();
            await page.getByText("Dashboard", { exact: true }).last().waitFor();
            console.log("PASS: guest can view the dashboard without being forced to register.");

            await page.getByText("Food diary", { exact: true }).last().click();
            await page.getByText("Create your free account", { exact: true }).waitFor({ timeout: 30000 });
            await page.getByText("Log in", { exact: true }).waitFor();
            await page.getByText("Create account", { exact: true }).waitFor();
            console.log("PASS: opening Food Diary while signed out displays the registration/login gate.");

            if (errors.length) throw new Error("Browser console errors: " + errors.join(" | "));
          } finally {
            await browser.close();
          }
          NODE
