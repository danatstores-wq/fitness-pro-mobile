name: Deploy FITNESS PRO web preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build Expo web app
        run: npx expo export --platform web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live-preview:
    name: Verify live browser features
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test database, profile saving, food categories and search
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          const errors = [];
          page.on("pageerror", error => errors.push(error.message));
          page.on("console", message => {
            if (message.type() === "error") errors.push(message.text());
          });
          page.on("dialog", dialog => dialog.accept());

          try {
            let isolated = false;
            for (let attempt = 0; attempt < 4; attempt += 1) {
              try {
                await page.goto(process.env.PREVIEW_URL, { waitUntil: "domcontentloaded", timeout: 120000 });
              } catch {}
              await page.waitForTimeout(4000);
              isolated = await page.evaluate(() => ({
                isolated: window.crossOriginIsolated,
                sharedArrayBuffer: typeof SharedArrayBuffer !== "undefined",
                controlled: Boolean(navigator.serviceWorker?.controller)
              }));
              if (isolated.isolated && isolated.sharedArrayBuffer) break;
              await page.reload({ waitUntil: "domcontentloaded", timeout: 120000 }).catch(() => {});
            }
            if (!isolated.isolated || !isolated.sharedArrayBuffer) {
              throw new Error("Web SQLite prerequisites failed: " + JSON.stringify(isolated));
            }

            // Exercise the exact v3.6 direct-host browser-to-Open-Food-Facts CORS path used by barcode lookup.
            const offLookup = await page.evaluate(async () => {
              const response = await fetch("https://world.openfoodfacts.org/api/v3.6/product/3017620422003.json");
              const payload = await response.json();
              return { httpStatus: response.status, status: payload?.status, productName: payload?.product?.product_name };
            });
            if (offLookup.httpStatus !== 200 || !offLookup.productName) {
              throw new Error("Open Food Facts browser lookup failed: " + JSON.stringify(offLookup));
            }
            console.log("PASS: browser can retrieve a known product from Open Food Facts: " + offLookup.productName);

            await page.getByText("Food diary", { exact: true }).last().click();
            try {
              await page.getByText("BROWSE BY CATEGORY", { exact: true }).waitFor({ timeout: 180000 });
            } catch (error) {
              console.error("FOOD DIARY DIAGNOSTICS:", JSON.stringify(await page.evaluate(() => ({ title: document.title, text: document.body?.innerText?.slice(0, 12000), url: location.href, isolated: window.crossOriginIsolated, controller: Boolean(navigator.serviceWorker?.controller) }))));
              console.error("BROWSER ERRORS:", JSON.stringify(errors));
              throw error;
            }
            await page.getByText("Meat & poultry", { exact: true }).click();
            await page.getByText(/chicken|beef|pork|turkey/i).first().waitFor({ timeout: 120000 });
            await page.getByPlaceholder("Search saved foods").fill("chicken");
            await page.getByText(/chicken/i).first().waitFor({ timeout: 30000 });
            console.log("PASS: food categories and chicken search return catalogue results.");

            await page.getByText("Profile", { exact: true }).last().click();
            await page.getByPlaceholder("Age", { exact: true }).fill("30");
            await page.getByText("Save profile", { exact: true }).click();
            await page.waitForTimeout(1500);
            await page.reload({ waitUntil: "domcontentloaded", timeout: 120000 });
            await page.waitForTimeout(3000);
            await page.getByText("Profile", { exact: true }).last().click();
            const savedAge = await page.getByPlaceholder("Age", { exact: true }).inputValue();
            if (savedAge !== "30") {
              throw new Error("Optional age-only profile value did not persist after reload: " + savedAge);
            }
            console.log("PASS: saving only age works and persists after reload; other profile fields remain optional.");

            if (errors.length) throw new Error("Browser console errors: " + errors.join(" | "));
          } finally {
            await browser.close();
          }
          NODE
