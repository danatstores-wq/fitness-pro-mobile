name: Build USDA FNDDS catalogue

on:
  push:
    paths:
      - "scripts/import-usda-foundation.mjs"
      - ".github/workflows/build-fndds-catalogue.yml"

permissions:
  contents: write

jobs:
  build-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fitness-pro-mobile
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download official USDA FNDDS 2021-2023 archive
        run: |
          curl --fail --location --retry 3 \
            "https://fdc.nal.usda.gov/fdc-datasets/FoodData_Central_survey_food_json_2024-10-31.zip" \
            --output /tmp/fndds.zip
      - name: Generate compressed catalogue
        run: node scripts/import-usda-foundation.mjs /tmp/fndds.zip src/data/usda-fndds-foods.ts
      - name: Commit generated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/usda-fndds-foods.ts
          if git diff --cached --quiet; then
            echo "Catalogue is already up to date."
          else
            git commit -m "Add USDA FNDDS 2021-2023 food catalogue"
            git push
          fi
