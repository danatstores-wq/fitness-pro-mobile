name: Validate FITNESS PRO mobile

on:
  push:
    branches: [main, feature/firebase-auth-gate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo dependency validation
        run: npx expo install --check
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform android --platform ios
