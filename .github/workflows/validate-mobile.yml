name: Validate FITNESS PRO mobile

on:
  push:
    branches: [main, feature/firebase-auth-gate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_ADMOB_USE_TEST_ADS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"
      - name: Verify Firebase API key secret is configured
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Add EXPO_PUBLIC_FIREBASE_API_KEY under Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Upload resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: fitness-pro-package-lock
          path: package-lock.json
          retention-days: 1
      - name: Report dependency security advisories
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          const fs = require("node:fs");
          for (const [label, path] of [["All dependencies", process.argv[2]], ["Production dependencies", process.argv[3]]]) {
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(`${label} audit counts:`, JSON.stringify(counts));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(`${item.severity.toUpperCase()} ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable)}`);
              console.log("  via:", JSON.stringify(item.via));
            }
            if ((counts.total ?? 0) > 0) {
              console.error(`${label} dependency audit found ${counts.total} advisory/advisories.`);
              process.exitCode = 1;
            }
          }
          NODE
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo dependency validation
        run: npx expo install --check
      - name: Generate and verify Android native configuration
        run: |
          npx expo prebuild --platform android --no-install
          node <<'NODE'
          const fs = require("node:fs");
          const manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          const required = [
            "android.permission.health.READ_STEPS",
            "expo.modules.healthkit.HEALTH_CONNECT_PRIVACY_POLICY_URL",
            "https://danatstores-wq.github.io/fitness-pro-mobile/privacy-policy.html",
            "ca-app-pub-1622329571366129~2966325014"
          ];
          const missing = required.filter(value => !manifest.includes(value));
          if (missing.length) {
            console.error("Android manifest is missing expected config:", missing);
            process.exit(1);
          }
          if (manifest.includes("android.permission.health.WRITE_STEPS")) {
            console.error("Unexpected Health Connect WRITE_STEPS permission is declared.");
            process.exit(1);
          }
          console.log("PASS: Android AdMob app ID, READ_STEPS-only permission and Health Connect privacy URL are configured.");
          NODE
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform android --platform ios
