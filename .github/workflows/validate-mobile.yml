name: Validate FITNESS PRO mobile

on:
  push:
    branches: [main, feature/firebase-auth-gate]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_ADMOB_USE_TEST_ADS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.3.0"
      - name: Verify Firebase API key secret is configured
        run: |
          if [ -z "$EXPO_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::Add EXPO_PUBLIC_FIREBASE_API_KEY under Repository Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
      - name: Install dependencies
        run: npm install
      - name: Report dependency security advisories
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("Dependency audit counts:", JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(`${item.severity.toUpperCase()} ${name} | direct=${item.isDirect} | range=${item.range} | fix=${JSON.stringify(item.fixAvailable)}`);
            for (const advisory of item.via ?? []) {
              if (typeof advisory === "object") console.log(`  - ${advisory.title}: ${advisory.url}`);
            }
          }
          NODE
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo dependency validation
        run: npx expo install --check
      - name: Bundle Android and iOS JavaScript
        run: npx expo export --platform android --platform ios
